<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickCaast — ricevi link sul PC</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512x512.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#0f1117; --card:#171a23; --border:#262a37; --text:#e8e9ee;
    --muted:#8a8fa3; --accent:#5b8cff; --ok:#3ecf8e; --warn:#ffb454;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:32px; max-width:420px; width:100%; text-align:center;
  }
  h1{font-size:22px; margin:0 0 4px}
  .sub{color:var(--muted); font-size:14px; margin-bottom:20px}
  #qrcode{display:inline-block; background:#fff; padding:12px; border-radius:12px; margin-bottom:16px}
  #status{font-size:15px; margin-bottom:8px; min-height:20px}
  #topicLabel{font-size:12px; color:var(--muted); font-family:monospace; margin-bottom:20px}
  .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle}
  .dot.waiting{background:var(--warn)}
  .dot.ok{background:var(--ok)}
  .dot.err{background:#ff5b6a}
  #incoming{
    display:none; background:#1c2233; border:1px solid var(--accent); border-radius:12px;
    padding:16px; margin-bottom:16px; word-break:break-all;
  }
  #incoming a{color:var(--accent); font-weight:600; text-decoration:none; font-size:15px}
  button{
    background:var(--accent); color:#fff; border:none; border-radius:10px;
    padding:10px 18px; font-size:14px; cursor:pointer;
  }
  button.secondary{background:transparent; border:1px solid var(--border); color:var(--muted)}
  .row{display:flex; gap:10px; justify-content:center; margin-top:6px}
  ul#log{list-style:none; padding:0; margin:20px 0 0; text-align:left; max-height:160px; overflow:auto}
  ul#log li{
    font-size:12px; padding:6px 0; border-bottom:1px solid var(--border);
    word-break:break-all;
  }
  ul#log a{color:var(--muted); text-decoration:none}
  ul#log a:hover{color:var(--text)}
</style>
</head>
<body>
  <div class="card">
    <h1>QuickCaast</h1>
    <div class="sub">Scansiona questo codice dal telefono per inviare un link</div>

    <div id="qrcode"></div>
    <div id="topicLabel"></div>

    <div id="status"><span class="dot waiting"></span>Generazione sessione...</div>

    <div id="incoming">
      Link ricevuto:<br>
      <a id="incomingLink" href="#" target="_blank" rel="noopener"></a>
    </div>

    <div class="row">
      <button id="newSession">Nuova sessione</button>
      <button id="clearLog" class="secondary">Svuota cronologia</button>
    </div>

    <ul id="log"></ul>
  </div>

<script>
let es = null;

function randomTopic() {
  const bytes = new Uint8Array(8);
  crypto.getRandomValues(bytes);
  const rand = Array.from(bytes, b => b.toString(36)).join('').slice(0, 12);
  return 'quickcaast-' + rand;
}

function setStatus(text, kind) {
  document.getElementById('status').innerHTML =
    '<span class="dot ' + kind + '"></span>' + text;
}

function startSession() {
  if (es) es.close();
  document.getElementById('incoming').style.display = 'none';

  const topic = randomTopic();
  const topicUrl = 'https://ntfy.sh/' + topic;

  document.getElementById('qrcode').innerHTML = '';
  new QRCode(document.getElementById('qrcode'), {
    text: topicUrl,
    width: 240,
    height: 240,
    correctLevel: QRCode.CorrectLevel.M
  });
  document.getElementById('topicLabel').textContent = topic;
  setStatus('Connessione al canale...', 'waiting');

  es = new EventSource(topicUrl + '/sse');

  es.onopen = () => setStatus('In attesa: scansiona il QR dal telefono', 'ok');

  es.onerror = () => setStatus('Connessione interrotta, riconnessione...', 'err');

  es.onmessage = (e) => {
    let data;
    try { data = JSON.parse(e.data); } catch (err) { return; }
    if (data.event === 'message' && data.message) {
      handleIncomingUrl(data.message);
    }
  };
}

function handleIncomingUrl(url) {
  setStatus('Link ricevuto ✅', 'ok');

  // log
  const li = document.createElement('li');
  const a = document.createElement('a');
  a.href = url; a.textContent = url; a.target = '_blank'; a.rel = 'noopener';
  li.appendChild(a);
  document.getElementById('log').prepend(li);

  // tentativo di apertura automatica (i browser possono bloccarlo: non e' un click reale)
  const opened = window.open(url, '_blank', 'noopener');

  // fallback sempre visibile: un click basta
  const box = document.getElementById('incoming');
  const link = document.getElementById('incomingLink');
  link.href = url;
  link.textContent = url;
  box.style.display = 'block';

  if (opened) {
    try { opened.focus(); } catch (e) {}
  }
}

document.getElementById('newSession').addEventListener('click', startSession);

document.getElementById('clearLog').addEventListener('click', () => {
  document.getElementById('log').innerHTML = '';
  document.getElementById('incoming').style.display = 'none';
});

startSession();
</script>
</body>
</html>
